services:
  app:
    image: mcr.microsoft.com/devcontainers/php:1-8.3-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on: [db]
  db:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - coop-mysql:/var/lib/mysql
      # First start only: create the schema (tables, views, triggers, event) and the app account.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-app-user.sql:/docker-entrypoint-initdb.d/02-app-user.sql:ro
volumes:
  coop-mysql:
